  <noscript>This course needs JavaScript for the interactive labs. The source and lesson content are also available in the repository.</noscript>
  
  <script id="course-sources" type="application/json">{"app.js":"import { DAYS, SOURCES, GLOSSARY } from './course.js';\nimport { DOCUMENTS } from './data.js';\nimport { rank } from './engine.js';\nimport { state, complete, answer, note, reset, restore, setDay, storageAvailable } from './store.js';\nimport { icon, escapeHTML as e, toast, download, openDialog } from './ui.js';\nimport { mountLab, mountPlayground } from './labs.js';\n\nlet dispose = ()=>{}, previousPath='';\nconst tabs=[['learn','Learn','book'],['lab','Experiment','flask'],['code','Code','code'],['quiz','Quick check','check']];\nconst nextDay = () => DAYS.find(d=>!state.completed.includes(d.id))?.id || 7;\nconst correctCount = d => d.quiz.filter((q,i)=>state.answers[d.id]?.[i]===q.answer).length;\nconst noteCard = d => `\u003cdiv class=\"note-card ${d.color}\">\u003clabel for=\"notes-${d.id}\">${icon('note')} ${d.name} · notes\u003c/label>\u003ctextarea id=\"notes-${d.id}\" data-note=\"${d.id}\" maxlength=\"8000\" placeholder=\"What clicked? What surprised you? Write it in your own words.\">${e(state.notes[d.id]||'')}\u003c/textarea>\u003csmall data-note-status=\"${d.id}\">${storageAvailable?'Saved only in this browser. Export to keep a backup.':'Session only — browser storage is unavailable.'}\u003c/small>\u003c/div>`;\n\nfunction shell(){\n  document.querySelector('#app').innerHTML=`\u003cdiv class=\"shell\">\u003cdiv class=\"sidebar-backdrop\" id=\"sidebar-backdrop\">\u003c/div>\u003caside class=\"sidebar\" id=\"sidebar\">\u003ca class=\"brand\" href=\"#/home\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTgiIGZpbGw9IiMyOTIzMzEiLz48Y2lyY2xlIGN4PSIyOCIgY3k9IjI4IiByPSIxMyIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZTZmYTdiIiBzdHJva2Utd2lkdGg9IjYiLz48cGF0aCBkPSJtMzggMzggMTIgMTIiIHN0cm9rZT0iI2U2ZmE3YiIgc3Ryb2tlLXdpZHRoPSI2IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48cGF0aCBkPSJtMjQgMjcgNCA0IDctOCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZiNGQ1IiBzdHJva2Utd2lkdGg9IjMiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjwvc3ZnPgo=\" alt=\"\">\u003cspan>search-engine\u003c/span>\u003c/a>\u003cdiv class=\"brand-sub\">A LITTLE LAB BY LERABYTE\u003c/div>\u003cnav class=\"main-nav\" aria-label=\"Main navigation\">\u003ca href=\"#/home\" data-nav=\"home\">${icon('map')}Course map\u003c/a>\u003ca href=\"#/playground\" data-nav=\"playground\">${icon('flask')}The playground\u003c/a>\u003ca href=\"#/glossary\" data-nav=\"glossary\">${icon('book')}Plain-English glossary\u003c/a>\u003ca href=\"#/notes\" data-nav=\"notes\">${icon('note')}My builder notes\u003c/a>\u003c/nav>\u003cdiv class=\"nav-label\">YOUR SEVEN-DAY BUILD\u003c/div>\u003cnav class=\"day-nav\" aria-label=\"Course lessons\">${DAYS.map(d=>`\u003ca href=\"#/day/${d.id}\" class=\"${d.color}\" data-day-nav=\"${d.id}\">\u003cspan class=\"day-dot\" data-dot=\"${d.id}\">${String(d.id).padStart(2,'0')}\u003c/span>\u003cspan>${d.name}\u003c/span>\u003c/a>`).join('')}\u003c/nav>\u003cdiv class=\"sidebar-footer\">\u003cdiv class=\"progress-caption\">\u003cspan>Your journey\u003c/span>\u003cspan data-progress-count>0 / 7\u003c/span>\u003c/div>\u003cdiv class=\"progress-track\" role=\"progressbar\" aria-label=\"Completed lessons\" aria-valuemin=\"0\" aria-valuemax=\"7\" aria-valuenow=\"0\" id=\"course-progress\">\u003cspan id=\"progress-fill\">\u003c/span>\u003c/div>\u003cp>A little curiosity. A lot of trying things.\u003c/p>\u003c/div>\u003c/aside>\u003cdiv class=\"page-shell\">\u003cheader class=\"topbar\">\u003cbutton class=\"icon-btn mobile-menu\" id=\"menu-toggle\" aria-label=\"Open navigation\" aria-expanded=\"false\" aria-controls=\"sidebar\">${icon('menu')}\u003c/button>\u003cspan class=\"topbar-left\">Learn it by \u003cstrong>building it.\u003c/strong>\u003c/span>\u003cdiv class=\"topbar-right\">\u003cspan class=\"pill\">${icon('bolt')}\u003cspan id=\"top-progress\">0 days complete\u003c/span>\u003c/span>\u003cspan class=\"top-small\">with \u003cstrong>@lerabyte\u003c/strong>\u003c/span>\u003cspan class=\"avatar\" aria-hidden=\"true\">lb\u003c/span>\u003c/div>\u003c/header>\u003cmain id=\"main\" tabindex=\"-1\">\u003c/main>\u003c/div>\u003c/div>`;\n  document.querySelector('#menu-toggle').onclick=()=>toggleMenu();document.querySelector('#sidebar-backdrop').onclick=()=>toggleMenu(false);\n  document.querySelector('#sidebar').addEventListener('click',ev=>{if(ev.target.closest('a'))toggleMenu(false);});\n  document.addEventListener('keydown',ev=>{if(ev.key==='Escape')toggleMenu(false);});\n  matchMedia('(max-width: 760px)').addEventListener('change',()=>toggleMenu(false));\n  toggleMenu(false);\n  updateProgress();\n}\nfunction toggleMenu(force){const open=force??!document.querySelector('#sidebar').classList.contains('open');document.querySelector('#sidebar').classList.toggle('open',open);document.querySelector('#sidebar-backdrop').classList.toggle('open',open);document.querySelector('#menu-toggle').setAttribute('aria-expanded',String(open));document.querySelector('#sidebar').inert=matchMedia('(max-width: 760px)').matches&&!open;}\nfunction updateProgress(){\n  const n=state.completed.length;\n  document.querySelectorAll('[data-progress-count]').forEach(x=>x.textContent=`${n} / 7`);\n  const bar=document.querySelector('#progress-fill');if(bar)bar.style.width=`${n/7*100}%`;\n  document.querySelector('#course-progress')?.setAttribute('aria-valuenow',String(n));\n  const label=document.querySelector('#top-progress');if(label)label.textContent=`${n} ${n===1?'day':'days'} complete`;\n  document.querySelectorAll('[data-dot]').forEach(el=>{const d=Number(el.dataset.dot),done=state.completed.includes(d);el.classList.toggle('done',done);el.innerHTML=done?icon('check'):String(d).padStart(2,'0');});\n}\nfunction footer(){return `\u003cfooter class=\"footer-line\">\u003cspan>Made for curious people. Built to be taken apart.\u003c/span>\u003cbutton class=\"text-link\" data-about style=\"font-size:inherit\">About this lab ${icon('external')}\u003c/button>\u003c/footer>`;}\nfunction bindAbout(){document.querySelectorAll('[data-about]').forEach(b=>b.onclick=()=>openDialog('A little lab by lerabyte',`\u003cp>A companion to the seven-part build-a-search-engine series. Day 1 follows Lera’s supplied narration; the remaining lessons expand the seven-day plan with explanations, experiments, and checks.\u003c/p>\u003cdiv class=\"notice warm\">\u003cp>\u003cstrong>What is real?\u003c/strong> Token counting, vector math, ranking, local graph crawling, passage selection, citation-offset checks, and benchmark calculations all run in your browser. The default semantic representation is hand-written, the crawler is a local simulation, and the answer builder is extractive. The optional Day 2 MiniLM mode is pretrained neural inference.\u003c/p>\u003c/div>\u003cp style=\"margin-top:18px\">No signup, analytics, or secret API keys. Progress and notes stay in this browser. External requests happen only when you open a source link or explicitly load the optional neural model. Source references and production extension notes are included in the repository.\u003c/p>`));}\nfunction bindNotes(){document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{note(Number(el.dataset.note),el.value);document.querySelector(`[data-note-status=\"${el.dataset.note}\"]`).textContent=storageAvailable?'Saved in this browser.':'Session only — storage unavailable. Export your notes before leaving.';}));}\nfunction home(main){\n  const next=nextDay();\n  main.innerHTML=`\u003cdiv class=\"page-intro\">\u003cspan class=\"eyebrow\">THE SEARCH ENGINE LAB\u003c/span>\u003cspan class=\"muted\">7 days. One very curious project.\u003c/span>\u003c/div>${state.completed.length===7?`\u003cdiv class=\"completion-banner\">${icon('flag')}\u003cdiv>\u003ch2>You built the whole picture.\u003c/h2>\u003cp>All seven days complete. Keep experimenting — and take your notes with you.\u003c/p>\u003c/div>\u003c/div>`:''}\u003csection class=\"hero\">\u003cdiv class=\"hero-copy\">\u003cspan class=\"tag\">${icon('spark')} AN INTERACTIVE BUILD-ALONG\u003c/span>\u003ch1>What happens\u003cbr>after you hit\u003cbr>\u003cem>search?\u003c/em>\u003c/h1>\u003cp>Let’s find out by building it. From a tiny collection of pages to an engine that finds, ranks, and explains.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"btn primary\" href=\"#/day/${next}\">${state.completed.length?'Keep building':'Let’s build it'}${icon('arrow')}\u003c/a>\u003ca class=\"btn light\" href=\"#/playground\">Try the playground\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"hero-art\">\u003cdiv class=\"demo-window\">\u003cdiv class=\"window-chrome\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003cspan>YOUR TINY INTERNET\u003c/span>\u003c/div>\u003cform class=\"demo-query\" id=\"hero-search\">${icon('search')}\u003clabel class=\"sr-only\" for=\"hero-query\">Try a live keyword query\u003c/label>\u003cinput id=\"hero-query\" value=\"how do neural networks learn?\" maxlength=\"200\" autocomplete=\"off\">\u003cbutton type=\"submit\" aria-label=\"Search the demo\">${icon('arrow')}\u003c/button>\u003c/form>\u003cdiv class=\"window-tokens\" id=\"hero-tokens\">\u003c/div>\u003cdiv id=\"hero-results\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"hero-label\">\u003cspan>\u003c/span>Real matches. Right in your browser.\u003c/div>\u003c/div>\u003cdiv class=\"floating-sticker\">not magic.\u003cbr>just a really good question. ↗\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"meta-strip\">\u003cspan>${icon('clock')}Go at your own pace\u003c/span>\u003cspan>${icon('flask')}7 hands-on experiments\u003c/span>\u003cspan>${icon('code')}Readable source code\u003c/span>\u003cspan>${icon('heart')}No signup. No API key.\u003c/span>\u003c/div>\u003csection>\u003cdiv class=\"section-heading\">\u003cdiv>\u003ch2>Your seven-day build.\u003c/h2>\u003cp>One new idea. One working experiment. Every day.\u003c/p>\u003c/div>\u003cspan class=\"pill\">All days unlocked\u003c/span>\u003c/div>\u003cdiv class=\"path-grid\">${DAYS.map(d=>`\u003ca class=\"path-card ${d.color}\" href=\"#/day/${d.id}\">\u003cdiv class=\"card-art\">\u003cspan class=\"day-num\">DAY ${String(d.id).padStart(2,'0')}\u003c/span>\u003cspan class=\"big-symbol\">${icon(state.completed.includes(d.id)?'check':d.icon)}\u003c/span>\u003c/div>\u003cdiv class=\"card-content\">\u003ch3>${d.name}\u003c/h3>\u003cp>${d.summary}\u003c/p>\u003cdiv class=\"card-bottom\">\u003cspan class=\"duration\">${icon('clock')}${d.time}\u003c/span>\u003cspan>${state.completed.includes(d.id)?'Done':state.labs.includes(d.id)?'Continue':'Explore'} ${icon('arrow')}\u003c/span>\u003c/div>\u003c/div>\u003c/a>`).join('')}\u003cdiv class=\"finish-card\">\u003cspan class=\"eyebrow\" style=\"color:var(--lime)\">YOUR NEXT GREAT QUESTION\u003c/span>\u003ch3>What will\u003cbr>you try next?\u003c/h3>\u003cp>Add your own pages. Break the ranking. Make it yours.\u003c/p>\u003ca class=\"text-link\" href=\"#/playground\">Open the playground ${icon('arrow')}\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"course-bottom\">${icon('eye')}\u003cdiv>\u003ch3>No mystery boxes here.\u003c/h3>\u003cp>See the math, the source text, and the limitations. Every demo tells you what is actually running.\u003c/p>\u003c/div>\u003cbutton class=\"text-link\" data-about>Look under the hood ${icon('arrow')}\u003c/button>\u003c/section>${footer()}`;\n  const renderDemo=()=>{const q=main.querySelector('#hero-query').value,rows=rank(q,DOCUMENTS,{mode:'keyword'});main.querySelector('#hero-tokens').innerHTML=(rows[0]?.terms||[]).slice(0,4).map(w=>`\u003cspan>${e(w)}\u003c/span>`).join('');main.querySelector('#hero-results').innerHTML=rows.slice(0,2).map(r=>`\u003cdiv class=\"hero-result\">\u003cdiv class=\"mini-doc\">${icon('note')}\u003c/div>\u003cdiv>\u003ch4>${e(r.doc.title)}\u003c/h4>\u003cp>${e(r.doc.body.slice(0,66))}…\u003c/p>\u003c/div>\u003cspan class=\"hero-score\">${r.score} pts\u003c/span>\u003c/div>`).join('')||'\u003cdiv class=\"hero-result\">\u003cdiv>\u003ch4>No exact matches.\u003c/h4>\u003cp>Try “neural networks” or “garlic pasta”.\u003c/p>\u003c/div>\u003c/div>';};\n  main.querySelector('#hero-search').onsubmit=ev=>{ev.preventDefault();renderDemo();};renderDemo();\n}\nfunction refsHTML(day){return `\u003cdiv class=\"source-links\">\u003cspan class=\"eyebrow\">GO TO THE SOURCE\u003c/span>${day.refs.map(key=>{const r=SOURCES[key];return `\u003ca href=\"${e(r.url)}\" target=\"_blank\" rel=\"noopener noreferrer\">${icon('external')}${e(r.name)}\u003c/a>`;}).join('')}\u003c/div>`;}\nfunction learnHTML(d){return `\u003cdiv class=\"lesson-layout\">\u003carticle class=\"reading\">\u003cp class=\"intro-text\">${d.intro}\u003c/p>${d.sections.map((s,i)=>`\u003csection class=\"reading-section\">\u003cspan class=\"section-no\">${String(i+1).padStart(2,'0')} / LET’S LOOK CLOSER\u003c/span>\u003ch2>${s.title}\u003c/h2>\u003cp>${s.text}\u003c/p>\u003cdetails>\u003csummary>The detail that matters\u003c/summary>\u003cp>${s.detail}\u003c/p>\u003c/details>\u003c/section>`).join('')}\u003cdiv class=\"bridge\">\u003cstrong>${d.id===7?'Keep building.':'Where we go next'}\u003c/strong>${d.bridge}\u003c/div>${refsHTML(d)}\u003c/article>\u003caside class=\"lesson-aside\">\u003csection class=\"mission-card ${d.color}\">\u003cspan class=\"eyebrow\">TODAY’S LITTLE MISSION\u003c/span>\u003ch3 style=\"margin-top:12px\">Try it. Then explain it.\u003c/h3>\u003col class=\"mission-list\">${d.mission.map(x=>`\u003cli>${x}\u003c/li>`).join('')}\u003c/ol>\u003ca class=\"btn primary\" href=\"#/day/${d.id}?tab=lab\">Enter the experiment ${icon('arrow')}\u003c/a>\u003c/section>\u003cdiv class=\"takeaway ${d.color}\">\u003cspan class=\"eyebrow\">THE THING TO REMEMBER\u003c/span>\u003cp>${d.takeaway}\u003c/p>\u003c/div>${noteCard(d)}\u003c/aside>\u003c/div>`;}\nfunction lesson(main,id,tab){\n  const d=DAYS[id-1];setDay(id);\n  document.title=`Day ${id}: ${d.name} · search-engine`;\n  main.innerHTML=`\u003cdiv class=\"page-intro\">\u003ca class=\"text-link\" href=\"#/home\" style=\"font-size:.73rem;text-decoration:none\">${icon('back')}Course map\u003c/a>\u003cspan class=\"eyebrow\">DAY ${String(id).padStart(2,'0')} OF 07\u003c/span>\u003c/div>\u003cheader class=\"lesson-banner ${d.color}\">\u003cdiv>\u003cdiv class=\"lesson-metadata\">\u003cspan class=\"eyebrow\">${d.category}\u003c/span>\u003cspan class=\"pill\">${icon('clock')}${d.time}\u003c/span>\u003c/div>\u003ch1>${d.name}.\u003c/h1>\u003cp>${d.subtitle}\u003c/p>\u003c/div>\u003cdiv class=\"lesson-mark\">${icon(d.icon)}\u003c/div>\u003c/header>\u003cdiv class=\"tabs\" role=\"tablist\" aria-label=\"Lesson sections\">${tabs.map(([v,label,ic])=>`\u003cbutton role=\"tab\" id=\"tab-${v}\" data-tab=\"${v}\" aria-selected=\"${tab===v}\" tabindex=\"${tab===v?'0':'-1'}\" aria-controls=\"lesson-panel\">${icon(ic)}${label}${v==='lab'&&state.labs.includes(id)?'\u003cspan class=\"tab-done\">✓\u003c/span>':v==='quiz'&&correctCount(d)===3?'\u003cspan class=\"tab-done\">✓\u003c/span>':''}\u003c/button>`).join('')}\u003c/div>\u003csection id=\"lesson-panel\" role=\"tabpanel\" aria-labelledby=\"tab-${tab}\">\u003c/section>\u003cnav class=\"lesson-footer\" aria-label=\"Continue the course\">\u003ca class=\"btn light small\" href=\"${id===1?'#/home':`#/day/${id-1}`}\">${icon('back')}${id===1?'Course map':`Day ${id-1}`}\u003c/a>\u003ca class=\"btn primary small\" href=\"${tab==='learn'?`#/day/${id}?tab=lab`:tab==='lab'?`#/day/${id}?tab=quiz`:id\u003c7?`#/day/${id+1}`:'#/notes'}\">${tab==='learn'?'Try the experiment':tab==='lab'?'Check your understanding':id\u003c7?`Explore day ${id+1}`:'Save your builder notes'}${icon('arrow')}\u003c/a>\u003c/nav>${footer()}`;\n  main.querySelectorAll('[data-tab]').forEach((b,i)=>{\n    b.onclick=()=>location.hash=`/day/${id}?tab=${b.dataset.tab}`;\n    b.onkeydown=ev=>{let target=null;if(ev.key==='ArrowRight')target=(i+1)%tabs.length;if(ev.key==='ArrowLeft')target=(i+tabs.length-1)%tabs.length;if(ev.key==='Home')target=0;if(ev.key==='End')target=tabs.length-1;if(target!==null){ev.preventDefault();location.hash=`/day/${id}?tab=${tabs[target][0]}`;}};\n  });\n  const body=main.querySelector('#lesson-panel');\n  if(tab==='learn')body.innerHTML=learnHTML(d);\n  if(tab==='lab')dispose=mountLab(id,body,()=>{updateProgress();const t=main.querySelector('#tab-lab');if(t&&!t.querySelector('.tab-done'))t.insertAdjacentHTML('beforeend','\u003cspan class=\"tab-done\">✓\u003c/span>');});\n  if(tab==='code'){\n    body.innerHTML=`\u003cdiv class=\"lesson-layout\">\u003cdiv>\u003cdiv class=\"lab-title\">\u003ch2>${d.codeTitle}\u003c/h2>\u003cp>Code you can read, run, and change.\u003c/p>\u003c/div>\u003cdiv class=\"code-panel\">\u003cdiv class=\"panel-head\">\u003ch2>JavaScript · day ${id}\u003c/h2>\u003cbutton class=\"btn small\" id=\"copy-code\">Copy code\u003c/button>\u003c/div>\u003cpre>\u003ccode>${e(d.code)}\u003c/code>\u003c/pre>\u003c/div>\u003cp class=\"code-note\">${d.codeNote}\u003c/p>\u003cdiv class=\"notice warm\">${icon('code')}\u003cp>From the repository folder, run \u003ccode class=\"inline-code\">node examples/day-${id}.mjs\u003c/code> to try the complete working example. These samples use the same core functions as the lab.\u003c/p>\u003c/div>${refsHTML(d)}\u003c/div>\u003caside class=\"lesson-aside\">\u003cdiv class=\"takeaway ${d.color}\">\u003cspan class=\"eyebrow\">READ THE REAL IMPLEMENTATION\u003c/span>\u003cp>All the mechanics live in \u003ccode class=\"inline-code\">src/engine.js\u003c/code>.\u003c/p>\u003c/div>${noteCard(d)}\u003c/aside>\u003c/div>`;\n    body.querySelector('#copy-code').onclick=async()=>{try{await navigator.clipboard.writeText(d.code);toast('Code copied. Go make something.');}catch{toast('Clipboard access is unavailable. Select the code to copy it.');}};\n  }\n  if(tab==='quiz')renderQuiz(body,d);\n  bindNotes();\n}\nfunction renderQuiz(root,d){\n  const count=correctCount(d),lab=state.labs.includes(d.id),done=state.completed.includes(d.id);\n  root.innerHTML=`\u003cdiv class=\"quiz-layout\">\u003cdiv class=\"questions\">${d.quiz.map((q,i)=>{const chosen=state.answers[d.id]?.[i],has=Number.isInteger(chosen),correct=chosen===q.answer;return `\u003csection class=\"question\">\u003cspan class=\"eyebrow\">QUICK CHECK ${i+1} / 3\u003c/span>\u003ch3 id=\"question-${i}\">${q.q}\u003c/h3>\u003cdiv class=\"choices\" role=\"group\" aria-labelledby=\"question-${i}\">${q.choices.map((c,j)=>`\u003cbutton class=\"choice ${chosen===j?`selected ${correct?'correct':'wrong'}`:''}\" data-answer=\"${j}\" data-question=\"${i}\" aria-pressed=\"${chosen===j}\">\u003cspan class=\"choice-letter\">${'ABC'[j]}\u003c/span>\u003cspan>${c}\u003c/span>\u003c/button>`).join('')}\u003c/div>${has?`\u003cdiv class=\"quiz-feedback\" role=\"status\">\u003cstrong>${correct?'Exactly.':'Not quite — you can try again.'}\u003c/strong> ${q.why}\u003c/div>`:''}\u003c/section>`;}).join('')}\u003c/div>\u003caside class=\"complete-card ${d.color}\">\u003cspan class=\"eyebrow\">UNDERSTANDING > MEMORIZING\u003c/span>\u003cdiv class=\"complete-count\" style=\"margin-top:18px\">${count}\u003cspan style=\"font-size:1.5rem;color:#83728e\"> / 3\u003c/span>\u003c/div>\u003ch2>${done?'Day complete!':'Ready to make it stick?'}\u003c/h2>\u003cp>Try the experiment and answer all three checks correctly. You can retry as often as you need.\u003c/p>\u003cdiv class=\"check-row ${lab?'':'unmet'}\">${icon(lab?'check':'flask')}${lab?'Experiment tried':'Try the experiment'}\u003c/div>\u003cdiv class=\"check-row ${count===3?'':'unmet'}\">${icon(count===3?'check':'book')}${count===3?'Three checks correct':'Answer all three checks'}\u003c/div>${done?`\u003ca class=\"btn primary\" href=\"${d.id\u003c7?`#/day/${d.id+1}`:'#/notes'}\">${d.id\u003c7?'On to the next day':'Save my notes'}${icon('arrow')}\u003c/a>`:`\u003cbutton class=\"btn primary\" id=\"complete-day\" ${lab&&count===3?'':'disabled'}>Complete day ${d.id} ${icon('check')}\u003c/button>`}${!lab?`\u003ca class=\"text-link\" href=\"#/day/${d.id}?tab=lab\" style=\"margin-top:17px\">Open the experiment ${icon('arrow')}\u003c/a>`:''}\u003c/aside>\u003c/div>`;\n  root.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const q=Number(b.dataset.question),choice=Number(b.dataset.answer);answer(d.id,q,choice);renderQuiz(root,d);const selected=root.querySelector(`[data-question=\"${q}\"][data-answer=\"${choice}\"]`);selected?.focus({preventScroll:true});});\n  root.querySelector('#complete-day')?.addEventListener('click',()=>{if(correctCount(d)!==3||!state.labs.includes(d.id))return;complete(d.id);updateProgress();celebrate();renderQuiz(root,d);toast(d.id===7&&state.completed.length===7?'Seven days complete. You built the whole picture!':`Day ${d.id} complete. Nice work.`);});\n}\nfunction celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#ffc4df','#dbd0ff','#ffe291','#bbebd6','#e6f58c'];for(let i=0;i\u003c30;i++){const p=document.createElement('i');p.className='confetti';p.style.left=`${Math.random()*100}%`;p.style.background=colors[i%colors.length];p.style.animationDelay=`${Math.random()*.3}s`;p.style.transform=`rotate(${Math.random()*180}deg)`;document.body.append(p);setTimeout(()=>p.remove(),2100);}}\nfunction glossary(main){\n  main.innerHTML=`\u003cdiv class=\"playground-header\">\u003cspan class=\"eyebrow\">LESS JARGON. MORE “OH, I GET IT.”\u003c/span>\u003ch1>A plain-English glossary.\u003c/h1>\u003cp>All the little words that make the bigger picture click.\u003c/p>\u003c/div>\u003cdiv class=\"search-form glossary-search\">\u003clabel class=\"sr-only\" for=\"glossary-query\">Search the glossary\u003c/label>\u003cinput type=\"search\" id=\"glossary-query\" placeholder=\"Search a word or an idea…\" autocomplete=\"off\">\u003c/div>\u003cp class=\"small muted\" id=\"glossary-count\" role=\"status\">\u003c/p>\u003cdiv class=\"glossary-grid\" id=\"glossary-results\">\u003c/div>${footer()}`;\n  const draw=()=>{const q=main.querySelector('#glossary-query').value.toLowerCase(),items=GLOSSARY.filter(x=>x.join(' ').toLowerCase().includes(q));main.querySelector('#glossary-count').textContent=`${items.length} term${items.length===1?'':'s'}`;main.querySelector('#glossary-results').innerHTML=items.map((g,i)=>`\u003carticle class=\"glossary-card ${DAYS[i%7].color}\" style=\"border-top:5px solid var(--tone)\">\u003ch3>${g[0]}\u003c/h3>\u003cp>${g[1]}\u003c/p>\u003csmall>${g[2]}\u003c/small>\u003c/article>`).join('')||'\u003cdiv class=\"empty-state\">\u003ch3>No terms match yet.\u003c/h3>\u003cp>Try “vector”, “source”, or “rank”.\u003c/p>\u003c/div>';};\n  main.querySelector('#glossary-query').oninput=draw;draw();\n}\nfunction notesPage(main){\n  main.innerHTML=`\u003cdiv class=\"playground-header\">\u003cspan class=\"eyebrow\">MAKE THE IDEAS YOURS\u003c/span>\u003ch1>Your builder notebook.\u003c/h1>\u003cp>The best test of understanding is explaining it in your own words. Everything here stays in this browser until you choose to export it.\u003c/p>\u003c/div>${state.completed.length===7?`\u003cdiv class=\"completion-banner\">${icon('flag')}\u003cdiv>\u003ch2>Seven days. Seven pieces of the puzzle.\u003c/h2>\u003cp>You completed every lesson. Keep this notebook as your record of the build.\u003c/p>\u003c/div>\u003c/div>`:''}\u003cdiv class=\"notes-actions\">\u003cbutton class=\"btn primary\" id=\"export-notes\">${icon('download')}Export notes\u003c/button>\u003cbutton class=\"btn light\" id=\"export-progress\">${icon('download')}Back up progress\u003c/button>\u003cbutton class=\"btn light\" id=\"restore-button\">${icon('folder')}Restore backup\u003c/button>\u003cinput type=\"file\" id=\"restore-file\" accept=\".json,application/json\" hidden>\u003cbutton class=\"btn light\" id=\"reset-progress\">${icon('reset')}Reset progress\u003c/button>\u003c/div>\u003cdiv class=\"notes-grid\">${DAYS.map(noteCard).join('')}\u003c/div>\u003csection class=\"faq\">\u003ch2>Before you take this further.\u003c/h2>\u003cdetails>\u003csummary>What is simulated, and what actually runs?\u003c/summary>\u003cp>All algorithm calculations run locally. The default semantic vectors are a hand-written teaching model, the crawler uses a local website graph, and the answer builder copies selected source sentences. Day 2 optionally supports pretrained MiniLM inference. The repository’s extension guide explains how to replace teaching components without hiding the distinction.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Where is my progress saved?\u003c/summary>\u003cp>In this browser’s localStorage, under the course-specific key. It is not synchronized across devices and can be lost when site data is cleared. Export a JSON backup to move your progress and notes to another browser.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>What should I build next?\u003c/summary>\u003cp>Choose a narrow collection of pages you have permission to use, label a set of test queries, and measure a keyword baseline. Then replace one component at a time: a trained embedding model, a server-side crawler, a generative model, or a better ranker. Keep your tests and inspect the failures.\u003c/p>\u003c/details>\u003c/section>${footer()}`;\n  bindNotes();\n  main.querySelector('#export-notes').onclick=()=>download('search-engine-builder-notes.md',`# My search-engine builder notes\\n\\nCompleted: ${state.completed.length}/7 days\\n\\n`+DAYS.map(d=>`## Day ${d.id}: ${d.name}\\n\\n${state.notes[d.id]||'(No notes yet.)'}\\n\\n`).join(''),'text/markdown;charset=utf-8');\n  main.querySelector('#export-progress').onclick=()=>download('search-engine-progress.json',JSON.stringify(state,null,2),'application/json');\n  main.querySelector('#restore-button').onclick=()=>main.querySelector('#restore-file').click();\n  main.querySelector('#restore-file').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;if(file.size>150000){toast('That backup is too large. Please use a course progress export.');return;}try{const raw=JSON.parse(await file.text());if(raw.version!==1)throw new Error('Unsupported backup format.');if(!confirm('Replace your current local course progress and notes with this backup?'))return;restore(raw);updateProgress();notesPage(main);bindAbout();toast('Progress restored in this browser.');}catch(err){toast(`Could not restore: ${err.message}`);}};\n  main.querySelector('#reset-progress').onclick=()=>{if(!confirm('Reset all course progress, quiz answers, notes, and indexed fixture pages? Export a backup first if you need it.'))return;reset();updateProgress();notesPage(main);bindAbout();toast('Fresh start. Your local progress has been reset.');};\n}\nfunction route(){\n  dispose();dispose=()=>{};\n  const raw=location.hash.replace(/^#\\/?/,'')||'home';const [path,qs='']=raw.split('?');const params=new URLSearchParams(qs);let tab=params.get('tab')||'learn';if(!tabs.some(x=>x[0]===tab))tab='learn';\n  const dayMatch=path.match(/^day\\/([1-7])$/),day=dayMatch?Number(dayMatch[1]):null;\n  document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===path;a.classList.toggle('active',active);active?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');});\n  document.querySelectorAll('[data-day-nav]').forEach(a=>{const active=Number(a.dataset.dayNav)===day;a.classList.toggle('active',active);active?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');});\n  document.title='search-engine · Build it. Understand it.';\n  const main=document.querySelector('#main');\n  if(day)lesson(main,day,tab);else if(path==='home')home(main);else if(path==='playground'){dispose=mountPlayground(main);main.insertAdjacentHTML('beforeend',footer());}else if(path==='glossary')glossary(main);else if(path==='notes')notesPage(main);else main.innerHTML=`\u003cdiv class=\"empty-state\">\u003ch1>Wrong turn?\u003c/h1>\u003cp style=\"margin:20px auto\">That page is not in our tiny internet. Let’s get you back to the course.\u003c/p>\u003ca class=\"btn primary\" href=\"#/home\">Open the course map ${icon('arrow')}\u003c/a>\u003c/div>`;\n  bindAbout();updateProgress();\n  if(previousPath!==path){window.scrollTo(0,0);if(previousPath)main.focus({preventScroll:true});}else if(day){main.querySelector('[role=\"tab\"][aria-selected=\"true\"]')?.focus({preventScroll:true});}\n  previousPath=path;\n}\nshell();window.addEventListener('hashchange',route);route();\n","course.js":"/** Course narration is original instructional expansion of the seven-day plan.\n * Day 1 follows the supplied script; Days 2–7 follow the plan in the conversation.\n */\nexport const SOURCES = {\n  ir: { name: 'Introduction to Information Retrieval · Stanford', url: 'https://nlp.stanford.edu/IR-book/' },\n  embeddings: { name: 'Semantic search · Sentence Transformers', url: 'https://sbert.net/examples/sentence_transformer/applications/semantic-search/README.html' },\n  rrf: { name: 'Reciprocal rank fusion · Elastic', url: 'https://www.elastic.co/docs/reference/elasticsearch/rest-apis/reciprocal-rank-fusion' },\n  robots: { name: 'Robots Exclusion Protocol · RFC 9309', url: 'https://www.rfc-editor.org/rfc/rfc9309.html' },\n  cors: { name: 'Cross-Origin Resource Sharing · MDN', url: 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS' },\n  rag: { name: 'Retrieval-Augmented Generation · Lewis et al.', url: 'https://arxiv.org/abs/2005.11401' },\n  metrics: { name: 'Evaluating ranked retrieval · Stanford', url: 'https://nlp.stanford.edu/IR-book/html/htmledition/evaluation-of-ranked-retrieval-results-1.html' },\n  neural: { name: 'Pretrained feature extraction · Transformers.js', url: 'https://huggingface.co/docs/transformers.js/en/pipelines' }\n};\nexport const DAYS = [\n  {\n    id: 1, name: 'Make it search', subtitle: 'Words in. Useful pages out.', color: 'yellow', icon: 'search', time: '15–20 min', category: 'THE FOUNDATION',\n    summary: 'Build a tiny internet, split a query into words, and give every page a score.',\n    intro: 'Let’s build an AI search engine from scratch. Before it can write answers or understand what we mean, it needs to do something much simpler: find information. Today we start with a tiny collection of pages, so we can actually see what happens between typing a question and getting a result.',\n    sections: [\n      { title: 'First, give it something to search.', text: 'Our tiny internet is a collection of documents, and every document has a title, a body, and a URL. That is enough to search the text and show a useful result. Open the collection in the lab and you will find pages about neural networks, Python, recipes, and a few unrelated topics. They are deliberately short: you should be able to look at a page and work out why it did or did not match.', detail: 'These are original teaching documents, not pages fetched from the live web. Their .test addresses are identifiers for our local examples. Searching this collection is not the same as searching the entire internet.' },\n      { title: 'Turn a question into something we can count.', text: 'When someone types “How do neural networks learn?”, we lowercase the query and split it into words. Then we can remove common words such as “how” and “do”, leaving “neural”, “networks”, and “learn”. We apply the same basic word splitting to each document, count exact matches, and add those counts together. In this first version, each occurrence contributes one point; the lab also lets you experiment with giving title matches extra weight.', detail: 'This tokenizer does not stem words, recognize phrases, or understand context. “Learn” and “learning” are different tokens. A repeated query word is counted once, so typing the same word ten times does not quietly change its weight. Stopword removal is optional because common words can matter in some searches.' },\n      { title: 'Let the scores decide the order.', text: 'Once every page has a score, we sort from highest to lowest and display the matches. Try “neural networks”, inspect the top result, and count the highlighted words yourself. Then change the query to “how do computers learn”. The article called “Introduction to machine learning” has useful information, but its title and body do not contain either “computers” or “learn”. Our literal matcher misses it, even though a person can connect those ideas.', detail: 'Counting words is a baseline, not a production relevance model. Long or repetitive pages can collect more points without being better answers. Later versions can use term rarity, length normalization, phrase matching, and other signals. Today the goal is to understand the complete path from input to sorted results.' }\n    ],\n    takeaway: 'A relevance score is a rule we define, not something the computer magically knows.',\n    mission: ['Search “how do neural networks learn?” and inspect the matching words.', 'Try “how do computers learn” and notice which useful page is missing.', 'Change title weight or stopwords and predict the effect before you search again.'],\n    bridge: 'Tomorrow, we keep the documents but change how we represent them, so different wording can still lead to a useful match.',\n    codeTitle: 'A small, inspectable word matcher',\n    code: `import { DOCUMENTS } from './src/data.js';\\nimport { rank } from './src/engine.js';\\n\\nconst query = 'how do neural networks learn?';\\nconst hits = rank(query, DOCUMENTS, {\\n  mode: 'keyword',\\n  titleWeight: 1,\\n  removeStopwords: true\\n});\\n\\nfor (const { doc, score, counts } of hits) {\\n  console.log(doc.title, score);\\n  console.table(counts);\\n}`,\n    codeNote: 'Run this in a module at the repository root, or try the equivalent command-line example. The actual tokenizer and scoring loop live in src/engine.js.',\n    refs: ['ir'],\n    quiz: [\n      { q: 'Our query is “learn”. A page contains only “learning”. What happens in Day 1?', choices: ['They automatically match.', 'They do not match as exact tokens.', 'The page gets half a point.'], answer: 1, why: 'Our first tokenizer does not reduce words to a stem. It compares the exact lowercase tokens.' },\n      { q: 'Why do we sort the scores?', choices: ['To put stronger matches before weaker ones.', 'To prove the highest result is true.', 'To change the text in every page.'], answer: 0, why: 'Sorting determines the display order. A high match score says nothing by itself about truth.' },\n      { q: 'Why can an excellent machine-learning article get a zero?', choices: ['The internet has stopped working.', 'Its URL must be too short.', 'It expresses the idea using different words.'], answer: 2, why: 'A lexical mismatch can hide a relevant article. That is the problem we explore next.' }\n    ]\n  },\n  {\n    id: 2, name: 'Search by meaning', subtitle: 'Different words. Related ideas.', color: 'pink', icon: 'spark', time: '20–25 min', category: 'THE REPRESENTATION',\n    summary: 'Make text numerical, compare vectors, and see why meaning is more than a word match.',\n    intro: 'Our search engine can find matching words, but it misses relationships that feel obvious to us. Today, let’s give each query and document a numerical representation, so we can compare what they are about even when they use different wording. The important change is not the search bar; it is the thing we compare behind it.',\n    sections: [\n      { title: 'An embedding is a list of coordinates.', text: 'Imagine describing a piece of text with numbers instead of keeping it only as a string of words. That list of numbers is a vector. With a trained text-embedding model, related text can receive similar vectors, which gives us a practical way to retrieve pages by semantic similarity. We create document vectors ahead of time, create a query vector when someone searches, and compare them in the same representation space.', detail: 'In the default lab, we use eight human-written concept axes so the coordinates are visible and understandable. This is an illustrative vocabulary model, not a trained neural embedding model. The optional MiniLM button downloads a real pretrained model and runs inference in your browser. It is not trained from scratch here.' },\n      { title: 'Compare directions, not just shared words.', text: 'Cosine similarity measures how closely two vectors point in the same direction. We multiply corresponding coordinates, add those products, and divide by the lengths of the two vectors. Normalization makes each nonzero vector have length one; the dot product then equals cosine similarity. If a vector is all zeros, our implementation returns zero rather than dividing by zero.', detail: 'Cosine similarity ranges from −1 to 1 in general. Our nonnegative teaching vectors produce values between 0 and 1. A similarity of 0.8 is not an 80% probability that the result is correct. The two-axis picture shows only a slice of the eight-dimensional teaching space; ranking uses all eight dimensions.' },\n      { title: 'Same topic is not always the same answer.', text: 'Search “how do computers learn” again and inspect the machine-learning article. In teaching mode, those words activate the learning axis, as do the article’s words about models and training. That is why the page can now be retrieved without exact matches. But a broad topic match can also bring back a page that does not answer the specific question. Try a very precise query, and watch how much detail this small representation throws away.', detail: 'Real models also need evaluation, especially for short queries and longer documents. They can struggle with negation, unusual names, domain-specific terms, and ambiguity. Use the same compatible model for queries and documents; vectors from unrelated models do not share a meaningful coordinate system.' }\n    ],\n    takeaway: 'Changing the representation changes what the search engine can recognize.',\n    mission: ['Search “how do computers learn” in teaching mode.', 'Inspect the coordinates and compare the top two similarity scores.', 'Try an unfamiliar phrase; notice the limits of a tiny vocabulary. The neural download is optional.'],\n    bridge: 'We do not have to throw away exact words to use meaning. Tomorrow, we combine both signals.',\n    codeTitle: 'Cosine similarity, without a black box',\n    code: `function cosine(a, b) {\\n  if (a.length !== b.length) {\\n    throw new Error('Dimensions must match');\\n  }\\n  const dot = a.reduce((sum, x, i) => sum + x * b[i], 0);\\n  const lengths = Math.hypot(...a) * Math.hypot(...b);\\n  return lengths ? dot / lengths : 0;\\n}\\n\\ncosine([1, 0], [1, 0]); // 1: same direction\\ncosine([1, 0], [0, 1]); // 0: perpendicular\\ncosine([1, 0], [-1, 0]); // -1: opposite`,\n    codeNote: 'src/neural.js contains the optional pretrained feature-extraction adapter. No model or credentials are downloaded until you choose to load it.',\n    refs: ['embeddings','neural'],\n    quiz: [\n      { q: 'Why embed both documents and the query with compatible representations?', choices: ['So both can be compared in the same vector space.', 'So every document gets the same vector.', 'So we can delete the original text.'], answer: 0, why: 'The coordinates must have compatible meaning for vector comparisons to be useful. Keep the original text for results and evidence.' },\n      { q: 'A cosine similarity of 0.8 means…', choices: ['The source is 80% accurate.', 'Their vector directions are quite similar.', 'The document contains eight query words.'], answer: 1, why: 'Cosine measures a geometric relationship, not a calibrated probability of correctness.' },\n      { q: 'What is the default eight-axis lab model?', choices: ['An LLM trained on the entire web.', 'A perfect semantic search engine.', 'A hand-written teaching representation.'], answer: 2, why: 'The default deliberately exposes the mechanics. The optional neural mode is separately labeled.' }\n    ]\n  },\n  {\n    id: 3, name: 'Rank the good stuff', subtitle: 'Two signals are better to investigate.', color: 'lavender', icon: 'bars', time: '15–20 min', category: 'THE RANKING',\n    summary: 'Mix exact matches with meaning, move the slider, and watch the result order change.',\n    intro: 'At this point, we have two different ways of deciding whether a page matters: it can contain the exact words we searched for, or it can describe a similar idea. Neither one is automatically best. Today, let’s combine them and make the tradeoff visible instead of burying it inside a scoring function.',\n    sections: [\n      { title: 'Keep the signal that matters for the query.', text: 'For “Python list comprehension”, the exact terms are useful. For “a shorter way to write a loop”, we may want the same article even though the wording changes. A hybrid ranker lets a page earn points from both literal matching and semantic similarity. It does not guarantee a better result for every query, but it gives us a balance we can inspect and test.', detail: 'This lab uses the same transparent teaching vectors as Day 2, not any optional neural model you loaded there. Keeping a fixed representation makes the ranking experiment reproducible and offline. Production systems might also rerank a short candidate list with a second model.' },\n      { title: 'Put the scores on comparable scales.', text: 'A keyword count might be 12 while a cosine similarity is 0.75, so adding them directly would quietly let the count dominate. Here, we divide each keyword score by the largest keyword score for that query. That places the normalized lexical values between zero and one. We can then choose a weight α and compute α × keyword + (1 − α) × similarity for each page.', detail: 'If every keyword score is zero, the normalized values remain zero. Query-wise maximum normalization is an educational choice, not the only method. Raw weighted addition does not calibrate scores as probabilities. The RRF option is an alternative that combines positions in separate result lists rather than their raw scores.' },\n      { title: 'Make a prediction, then touch the slider.', text: 'Move the slider all the way toward exact words, inspect the top three results, and then move toward meaning. Each result shows its two contributions, so you can tell why it moved rather than only noticing that it did. Try the precise and conversational versions of the Python query. Keep a note of one change you expect to help, because on Day 7 we will test assumptions across more than one favorite example.', detail: 'Changing the weight based on a handful of examples can overfit those examples. In a larger project, keep separate development queries for tuning and held-out queries for evaluation. A small score change can swap two nearly tied results without meaningfully changing answer quality.' }\n    ],\n    takeaway: 'A ranking system is a collection of explicit decisions about which signals to trust.',\n    mission: ['Compare “Python list comprehension” with “a shorter way to write a loop”.', 'Move the exact-word weight to 0%, 50%, and 100%.', 'Inspect a score breakdown, then compare the RRF alternative.'],\n    bridge: 'Better ranking cannot find a page that is missing from our collection. Tomorrow, we build the discovery step.',\n    codeTitle: 'A normalized hybrid score',\n    code: `const largestCount = Math.max(0, ...rows.map(r => r.keyword));\\nconst alpha = 0.5;\\n\\nfor (const row of rows) {\\n  const keyword = largestCount ? row.keyword / largestCount : 0;\\n  row.score = alpha * keyword\\n            + (1 - alpha) * row.semantic;\\n}\\n\\nrows.sort((a, b) => b.score - a.score);`,\n    codeNote: 'The full rank() function also removes zero-score results and breaks ties consistently by document ID. The RRF option uses a rank constant of 60.',\n    refs: ['ir','rrf'],\n    quiz: [\n      { q: 'Why normalize keyword counts before mixing them with cosine scores?', choices: ['To force the same page to win.', 'To make the numeric scales more comparable.', 'To convert the scores into truth probabilities.'], answer: 1, why: 'Different scales would make the mixing weight misleading. Normalization still does not establish truth.' },\n      { q: 'With α = 1 in our weighted sum, which signal decides the order?', choices: ['Only the normalized keyword signal.', 'Only semantic similarity.', 'Both signals equally.'], answer: 0, why: 'The semantic contribution is multiplied by 1 − α, which becomes zero.' },\n      { q: 'What does reciprocal rank fusion combine?', choices: ['URL lengths.', 'The average document text.', 'Positions in separate result lists.'], answer: 2, why: 'RRF uses reciprocal rank contributions rather than directly adding incomparable raw relevance scores.' }\n    ]\n  },\n  {\n    id: 4, name: 'Follow the links', subtitle: 'Give your tiny internet room to grow.', color: 'mint', icon: 'globe', time: '20–25 min', category: 'THE DISCOVERY',\n    summary: 'Step through a crawler, inspect its queue, skip duplicates, and grow your index.',\n    intro: 'So far, every page in our engine is something we have manually given it. Today, let’s build the idea that makes a collection grow: start on a page, save useful content, find the links, and visit the next page. We will follow that process one step at a time so it never feels like the crawler is magically discovering the web.',\n    sections: [\n      { title: 'A crawler needs a to-do list.', text: 'We begin with one starting URL in a queue. On each step, the crawler takes the first URL, checks it, reads the page, and adds its discovered links to the end of the queue. This breadth-first order explores nearby pages before moving farther away. The little website in the lab is a fixed local graph, which lets us watch exactly where each link leads without making any external requests.', detail: 'This is a simulation of crawling, not a crawler secretly browsing live sites. A static browser course cannot reliably fetch arbitrary sites because of browser security restrictions such as CORS. A real crawler normally runs on a server and needs network-level controls as well as page parsing.' },\n      { title: 'Not every link deserves a visit.', text: 'Pages often link back to each other, so a seen set stops us from looping forever. We remove URL fragments so /neural and /neural#weights are treated as the same page in this example. The domain allowlist rejects links outside byte.test, the private page is blocked by our fixture’s robots rule, and a missing page becomes a recorded error rather than crashing the whole crawl.', detail: 'The fixture’s blocked flag illustrates the decision; it is not a complete robots.txt parser. Real crawlers must obey applicable access restrictions, respect robots policies, identify themselves, limit request rates, cap response sizes, and handle redirects and failures. Robots rules are not authentication and should not be used to protect secrets.' },\n      { title: 'Discovery and search are different jobs.', text: 'When an allowed page contains a document, the crawler saves its identifier in the index. Ranking still happens later, when a user asks a question. Click “Use indexed pages” after discovering the two new teaching pages, and the playground will include them alongside the original collection. Now the index can grow without changing the basic search interface or scoring rules.', detail: 'A real index is a stored representation of previously collected content, not a live view of every site. Large systems also need content deduplication, refresh schedules, storage, inverted indexes, vector indexes, and deletion policies. We deliberately keep those outside today’s small, inspectable graph.' }\n    ],\n    takeaway: 'A crawler collects information. The ranker decides which of that information fits a query.',\n    mission: ['Step through the first few URLs and watch the queue change.', 'Find a duplicate, an outside-domain link, and a blocked page in the log.', 'Run the crawl, then add its indexed pages to your playground.'],\n    bridge: 'Now we can find relevant pages. Tomorrow, we use their passages to help answer a question.',\n    codeTitle: 'Watch a complete local crawl',\n    code: `import { createCrawler, crawlStep, indexedDocuments }\\n  from './src/engine.js';\\n\\nlet crawler = createCrawler(12);\\nwhile (!crawler.done) {\\n  crawler = crawlStep(crawler);\\n  console.log(crawler.log[0]);\\n}\\n\\nconst collected = indexedDocuments(crawler.indexed);\\nconsole.log(collected.map(page => page.title));`,\n    codeNote: 'crawlStep() follows only the local graph in src/data.js. It does not issue HTTP requests or bypass anyone’s access controls.',\n    refs: ['robots','cors'],\n    quiz: [\n      { q: 'What belongs in the crawler queue?', choices: ['The answer to the current question.', 'The model’s neural weights.', 'URLs waiting to be considered.'], answer: 2, why: 'The queue is the crawler’s to-do list. Each step removes one URL and may discover more.' },\n      { q: 'Why maintain a seen set?', choices: ['To avoid visiting the same canonical URL repeatedly.', 'To make blocked pages public.', 'To assign relevance scores before a query exists.'], answer: 0, why: 'Links form cycles. A seen set prevents repeated visits from turning into an endless loop.' },\n      { q: 'Does this lesson actually crawl public websites?', choices: ['Yes, the whole internet.', 'No, it steps through a clearly labeled local website simulation.', 'Only private websites.'], answer: 1, why: 'The local fixture makes the behavior reproducible, safe, and inspectable without a server.' }\n    ]\n  },\n  {\n    id: 5, name: 'From links to answers', subtitle: 'Give the answer something to stand on.', color: 'peach', icon: 'chat', time: '20–25 min', category: 'THE ANSWER',\n    summary: 'Retrieve passages, assemble context, and see the structure of a grounded answer.',\n    intro: 'Getting useful links is a big step, but it still leaves the reader to open every page and assemble the answer. Today, let’s connect retrieval to an answer step. The key idea is to find relevant source passages first, then give the answer-writing system that evidence instead of asking it to answer from nowhere.',\n    sections: [\n      { title: 'Retrieve before you write.', text: 'The pipeline starts with the same query and ranking system we already have. We select a small number of relevant documents, split them into passages, and keep the most useful text within a context budget. The user’s question and those passages can then become the input to a language model. This pattern is called retrieval-augmented generation, or RAG: retrieval supplies context, while generation writes an answer.', detail: 'The default course does not call an LLM. Our offline answer builder selects and copies source sentences so you can inspect the evidence path without an API key. It demonstrates retrieval and context assembly, not neural generation. The generated prompt is ready to inspect, and docs/EXTENDING.md explains the production boundary.' },\n      { title: 'Bring enough context, not every page.', text: 'Open the evidence tray and change how many documents we retrieve. A passage may contain the answer, but a short snippet can also lose a definition or qualification. Keeping passage IDs, document IDs, and character offsets lets us trace each selected sentence back to its exact location. In this demo, the context budget is measured in characters; a real model needs its own token accounting.', detail: 'Source content is untrusted data. A webpage might contain instructions that try to redirect the answer system. Delimiting passages and telling the model to treat them as data is useful, but it is not a complete prompt-injection defense. Do not let retrieved instructions authorize tools, access secrets, or change system policy.' },\n      { title: 'A missing answer is a real result.', text: 'Try the neural-network question with context enabled, then switch the evidence off. Without matching passages, our baseline refuses to manufacture an answer. That behavior is more useful than displaying a polished paragraph with nothing underneath it. Even with passages, an extractive selection can be incomplete or irrelevant, and a generative model can still make unsupported claims; the next lesson focuses on checking that connection.', detail: 'We use “not enough matching evidence” rather than claiming certainty about every possible answer. Search may fail even when useful information exists. A deployed system needs retrieval evaluation, calibrated refusal behavior, source-quality checks, and human review appropriate to its use.' }\n    ],\n    takeaway: 'Evidence should enter the system before an answer leaves it.',\n    mission: ['Ask how neural networks learn and inspect the retrieved passages.', 'Open the assembled prompt and locate the source IDs.', 'Turn off context and compare the result with an unrelated query.'],\n    bridge: 'Tomorrow, we make the source connection visible and check whether the evidence actually supports each claim.',\n    codeTitle: 'Build an inspectable, extractive answer',\n    code: `import { buildAnswer } from './src/engine.js';\\n\\nconst result = buildAnswer('how do neural networks learn?',\\n  undefined, { k: 3, withContext: true });\\n\\nconsole.log(result.text);\\nconsole.log(result.passages); // Exact sentences + offsets\\nconsole.log(result.prompt);   // Context for a future LLM\\n\\n// No hidden network call. No text-generation model.\\n// The baseline copies relevant source sentences.`,\n    codeNote: 'The answer code runs locally. It never requires a secret in the browser and never describes a copied passage as live LLM output.',\n    refs: ['rag'],\n    quiz: [\n      { q: 'What is the right order in this RAG pattern?', choices: ['Write an answer, then invent sources.', 'Retrieve evidence, supply context, then answer.', 'Discard all documents before asking a model.'], answer: 1, why: 'Retrieval provides the evidence the answer step should use.' },\n      { q: 'What should happen when matching evidence is missing?', choices: ['Always guess confidently.', 'Reuse any citation number.', 'Clearly say the collection does not supply enough evidence.'], answer: 2, why: 'A refusal or limitation is more honest than fabricated content, though retrieval failure also needs investigation.' },\n      { q: 'What creates the default answer in this course?', choices: ['A local extractive sentence selector.', 'A secret paid API call.', 'A newly trained frontier LLM.'], answer: 0, why: 'The course baseline is transparent and API-free. RAG generation is explained, not misrepresented as already connected.' }\n    ]\n  },\n  {\n    id: 6, name: 'Show the receipts', subtitle: 'A citation is a starting point, not proof.', color: 'blue', icon: 'link', time: '15–20 min', category: 'THE EVIDENCE',\n    summary: 'Open source passages, audit claims, and catch a convincing-looking bad citation.',\n    intro: 'Our system can now produce an answer from retrieved text, but how does the reader check where a particular claim came from? Today, let’s make the sources clickable and practice the important part: deciding whether a passage really supports the sentence beside its citation.',\n    sections: [\n      { title: 'Keep an address for each piece of evidence.', text: 'A document URL gets you to a page, but a passage ID and character offsets get you to the part the answer used. Our answer builder keeps that information together instead of trying to reconstruct it afterward. When the reader opens a source, the course shows the exact stored text. A simple validator can check that the document exists and that the cited text matches the stored slice.', detail: 'That validator checks provenance integrity, not factual truth or logical entailment. If a source itself is wrong, accurately quoting it does not fix it. If an answer adds an unsupported claim before a valid quotation, matching offsets will not detect that mistake.' },\n      { title: 'Ask what the passage actually establishes.', text: 'In the audit lab, one claim is directly supported, another reverses what the source says, and a third makes a comparison the source never measured. Read the passage before choosing a verdict. The difference between “contradicted” and “not enough evidence” matters: absence of support is not automatically evidence of the opposite.', detail: 'A source about how to evaluate retrieval cannot establish that your project is faster than every commercial engine. A benchmark claim needs a defined test set, conditions, systems, dates, and measurements. Stronger wording needs stronger evidence.' },\n      { title: 'Make uncertainty visible in the interface.', text: 'Citations should reduce the reader’s work, not decorate an answer. Keep them near the claim, make the source easy to inspect, and avoid implying that a check mark proves the whole answer is correct. In your production version, you might return structured claims and passage IDs, reject nonexistent references, and flag unsupported sentences for revision or review.', detail: 'Automatic support checks can help, but they can also be wrong. Independent verification matters more for higher-stakes uses. The exercise today uses authored answers and explanations so you can practice the reasoning without treating another model as a perfect judge.' }\n    ],\n    takeaway: 'Check the claim against the passage, not just the presence of a citation.',\n    mission: ['Open each of the three source passages.', 'Mark each claim as supported, contradicted, or not enough evidence.', 'Explain why an existing source can still be a bad citation for a claim.'],\n    bridge: 'For the final day, we stop judging by a single good demo and measure the whole search pipeline.',\n    codeTitle: 'Check whether a quote belongs to a source',\n    code: `function quoteBelongsToSource(passage, documents) {\\n  const doc = documents.find(d => d.id === passage.docId);\\n  if (!doc) return false;\\n  return doc.body.slice(passage.start, passage.end)\\n    === passage.text;\\n}\\n\\n// This checks the stored quote, NOT the truth of a claim.\\n// The full validator also checks offset bounds and types.`,\n    codeNote: 'Inspect validateCitation() in src/engine.js. The audit lab uses human-authored support judgments, not an automatic fact-checking service.',\n    refs: ['rag','ir'],\n    quiz: [\n      { q: 'The cited URL exists. What can we conclude?', choices: ['Every sentence in the answer is true.', 'The claim still needs to be checked against its source.', 'The source was read by a human.'], answer: 1, why: 'Existence alone establishes neither support nor truth.' },\n      { q: 'A source never measures speed. A claim says our engine is fastest. The verdict is…', choices: ['Supported.', 'Automatically the opposite is true.', 'Not enough evidence from that source.'], answer: 2, why: 'The passage supplies no timing comparison. We should not invent either a positive or negative conclusion.' },\n      { q: 'What do exact character offsets help us verify?', choices: ['Where the quoted text appears in the stored document.', 'That no source can ever change.', 'That every related claim is correct.'], answer: 0, why: 'Offsets let us reconstruct the evidence slice, while factual and logical support still require checking.' }\n    ]\n  },\n  {\n    id: 7, name: 'Put it to the test', subtitle: 'A good demo is not a benchmark.', color: 'lime', icon: 'flag', time: '20–25 min', category: 'THE FINISH LINE',\n    summary: 'Compare three rankers, inspect relevance judgments, and export your actual results.',\n    intro: 'For the last six days, we have improved one part of the system at a time. Now let’s find out which changes help across several questions rather than assuming the last version must be better. A test needs queries, a definition of a useful result, and measurements that we can reproduce.',\n    sections: [\n      { title: 'Decide what a good result looks like first.', text: 'Our benchmark includes exact searches, conversational rephrasings, a practical recipe question, and an out-of-collection query. Each one has an authored list of relevant document IDs that you can open before running the comparison. Those judgments are part of the experiment, not unquestionable truth. In a larger project, ask multiple reviewers to label results and document disagreements.', detail: 'This is a tiny, curated teaching benchmark over our local corpus. It is not a comparison against Google, Perplexity, or ChatGPT, and it should not be used to claim a commercial win. You can use the supplied comparison worksheet to record a separate, clearly dated manual test.' },\n      { title: 'Look at more than one measurement.', text: 'Precision at three counts how many of the first three result slots are relevant and divides by three. Recall at three asks how many of the known relevant documents appear in those slots. Reciprocal rank gives 1 for a relevant result in first place, 1/2 for second, and so on; we average it across in-scope queries to get MRR. These measures tell different stories, so inspect the per-query results instead of only celebrating one average.', detail: 'Empty result slots count as nonrelevant for our P@3 convention. Queries with no relevant documents are excluded from relevance averages and get a separate abstention measurement. This demo’s MRR uses the full returned ranking, while precision and recall use the first three results. Timing is measured locally and excludes network/model downloads.' },\n      { title: 'Change one thing, then compare again.', text: 'Run the keyword, teaching-vector, and hybrid rankers against exactly the same questions. Change the hybrid weight, rerun, and look for both improvements and regressions. Export the rows so the result of your experiment survives beyond the animation. If a change helps only the examples you used to tune it, you have learned something important about overfitting, not finished the evaluation.', detail: 'A production test also needs latency distributions, source coverage, freshness, cost, robustness, answer correctness, and citation support. Keep tuning queries separate from a held-out evaluation set. This course measures retrieval; it does not benchmark a language model’s answer quality.' }\n    ],\n    takeaway: 'Measure the behavior you care about, and be specific about what your test does not show.',\n    mission: ['Inspect a relevance judgment, then run all three rankers.', 'Change the hybrid weight and find one query whose result changes.', 'Export the CSV, finish your checks, and save your builder notes.'],\n    bridge: 'You now have an inspectable search pipeline and a method for improving it. The next step is replacing the teaching components one at a time, while keeping your tests.',\n    codeTitle: 'Make a test you can run again',\n    code: `import { benchmark } from './src/engine.js';\\n\\nconst report = benchmark(0.5);\\nfor (const result of report) {\\n  console.log(result.mode, {\\n    precisionAt3: result.precision,\\n    recallAt3: result.recall,\\n    meanReciprocalRank: result.mrr,\\n    outOfCollectionAbstention: result.abstention\\n  });\\n}\\n\\n// Same queries. Same corpus. Different ranking method.`,\n    codeNote: 'Judgments live in src/data.js and metric definitions live in src/engine.js. tests/engine.test.mjs includes hand-calculated metric checks.',\n    refs: ['metrics','ir'],\n    quiz: [\n      { q: 'Two of the first three result slots are relevant. P@3 is…', choices: ['2/3.', '3/2.', 'Exactly 1.'], answer: 0, why: 'Relevant items in the first three slots divided by three gives 2/3.' },\n      { q: 'The first relevant result appears in position 4. Reciprocal rank is…', choices: ['4.', '0.25.', '0.75.'], answer: 1, why: 'Reciprocal rank is 1 divided by the position of the first relevant result.' },\n      { q: 'Our hybrid ranker wins on these eight examples. What is a fair conclusion?', choices: ['It beats every commercial engine.', 'We never need to test again.', 'It performed better on this specific teaching test, if the measurements show that.'], answer: 2, why: 'A small local result supports a small local conclusion, not a universal product claim.' }\n    ]\n  }\n];\nexport const GLOSSARY = [\n  ['Query','The words or question someone gives the search engine.','Try the same idea with different wording.'],\n  ['Corpus','The collection of documents available to search.','A search engine cannot retrieve a page that is missing from its corpus.'],\n  ['Token','A unit produced when text is split for processing.','In Day 1 our tokens are lowercase words; LLM tokenizers can split text differently.'],\n  ['Stopword','A common word optionally removed before matching.','Removing “how” and “do” can make the neural-network example more focused.'],\n  ['Embedding','A numerical representation, often learned, of an item such as text.','The default lab uses explicitly hand-written concept coordinates, not neural inference.'],\n  ['Cosine similarity','A measure of how closely two nonzero vectors point in the same direction.','A similarity score is not a probability that an answer is correct.'],\n  ['Hybrid search','Retrieval that combines lexical and vector-based signals.','We normalize counts and mix them with teaching-vector similarity.'],\n  ['Index','A stored representation of documents used for retrieval.','An index is not necessarily a live view of the web.'],\n  ['Crawler','A program that discovers pages, commonly by following links.','Our Day 4 crawler explores a local website fixture, not the public web.'],\n  ['RAG','Retrieval-augmented generation: supply retrieved evidence to an answer-generating model.','The default course demonstrates context assembly with an extractive answer baseline.'],\n  ['Citation','A pointer from a claim to a source or passage.','A source can exist without supporting the claim.'],\n  ['Precision@k','Relevant items in the first k result slots, divided by k.','In this course, empty slots count as nonrelevant.'],\n  ['Recall@k','Known relevant items retrieved in the first k slots, divided by all known relevant items.','Depends on the completeness of your relevance judgments.'],\n  ['MRR','Mean reciprocal rank: the average of 1 / first relevant position across queries.','For a query with no relevant result returned, its reciprocal rank is zero.'],\n  ['Abstention','Declining to supply an answer or result when evidence is inadequate.','Refusing to invent an answer is useful; missing good evidence is still a retrieval problem.']\n];\n","data.js":"/** Original, tiny teaching corpus. .test URLs identify local fixtures, not live websites. */\nexport const DOCUMENTS = [\n  { id: 'neural', title: 'How neural networks learn', topic: 'Machine learning', url: 'https://byte.test/neural', body: 'Neural networks learn by comparing predictions with targets. Training updates connection weights to reduce prediction error. Neural networks have an input layer, hidden layers, and an output layer.' },\n  { id: 'ml', title: 'Introduction to machine learning', topic: 'Machine learning', url: 'https://byte.test/ml', body: 'Models identify patterns in training data. A training algorithm adjusts parameters to reduce prediction error. The resulting model can generalize to unseen examples, but its performance depends on the task and the data.' },\n  { id: 'python', title: 'Python list comprehensions', topic: 'Programming', url: 'https://byte.test/python', body: 'A list comprehension creates a new Python list from an iterable in one expression. Use [x * 2 for x in numbers] instead of a loop that appends each doubled value. A filter can keep only selected items.' },\n  { id: 'loops', title: 'Writing a for loop', topic: 'Programming', url: 'https://byte.test/loops', body: 'A Python for loop repeats a block for each item in a sequence. Loops are useful when a repeated task needs several steps. More compact code is not always easier to read.' },\n  { id: 'pasta', title: 'Weeknight garlic pasta', topic: 'Cooking', url: 'https://byte.test/pasta', body: 'Cook pasta in salted water until tender. Warm garlic in olive oil, then toss with the pasta and a little cooking water. Finish with parmesan for a quick dinner.' },\n  { id: 'soup', title: 'A simple vegetable soup', topic: 'Cooking', url: 'https://byte.test/soup', body: 'Soften onion and carrot in olive oil. Add vegetable stock, beans, and tomatoes, then simmer until the vegetables are tender. This one-pot dinner is easy to adapt.' },\n  { id: 'vectors', title: 'Embeddings and vector similarity', topic: 'Search', url: 'https://byte.test/vectors', body: 'An embedding represents text as a vector of numbers. A trained model can place related phrases near each other in its vector space. Cosine similarity compares vector directions, but a high score does not prove that a document answers the question.' },\n  { id: 'keywords', title: 'Keyword search, one match at a time', topic: 'Search', url: 'https://byte.test/keywords', body: 'Keyword search counts matching terms in documents. Lowercasing makes Neural and neural match. Common words may be removed, but a basic word matcher does not know that differently worded phrases can refer to the same idea.' },\n  { id: 'hybrid', title: 'Ranking with more than one signal', topic: 'Search', url: 'https://byte.test/hybrid', body: 'Hybrid search combines lexical matches with vector similarity. Scores need comparable scales before a weighted sum is meaningful. Ranking is an ordering of candidates, not a guarantee of truth.' },\n  { id: 'crawler', title: 'A small, polite web crawler', topic: 'The web', url: 'https://byte.test/crawler', body: 'A crawler visits a page, extracts its text, and discovers links to other pages. A queue tracks pages still to visit while a seen set prevents duplicate visits. Respect robots rules, rate limits, and a strict domain allowlist.' },\n  { id: 'sources', title: 'Why citations need checking', topic: 'Evidence', url: 'https://byte.test/sources', body: 'A citation points a reader to a source passage. Check whether that passage actually supports the claim. An existing URL or a matching quotation alone does not establish that every surrounding claim is true.' },\n  { id: 'rag', title: 'Retrieval before an answer', topic: 'Evidence', url: 'https://byte.test/rag', body: 'Retrieve relevant passages before asking a language model to write an answer. Keep source identifiers with each passage so the reader can inspect the evidence. When the collection lacks enough evidence, say so rather than inventing an answer.' },\n  { id: 'evaluation', title: 'Is the search engine any good?', topic: 'Evaluation', url: 'https://byte.test/evaluation', body: 'Evaluate search against a set of queries with human relevance judgments. Precision at three measures relevant results in the first three slots. Reciprocal rank rewards placing the first relevant result near the top.' },\n  { id: 'plants', title: 'Caring for a houseplant', topic: 'Everyday life', url: 'https://byte.test/plants', body: 'Check soil moisture before watering a houseplant. Place the plant in light suited to its species. Yellow leaves have several possible causes, so check the growing conditions instead of assuming one cause.' },\n  { id: 'hiking', title: 'A day on a mountain trail', topic: 'Everyday life', url: 'https://byte.test/hiking', body: 'Choose a trail suited to your experience and check the weather before a hike. Pack water, a map, and layers. Turn back when conditions become unsafe.' },\n  { id: 'music', title: 'Finding new music', topic: 'Everyday life', url: 'https://byte.test/music', body: 'A music recommendation system can compare listening patterns or features of songs. Recommendations are predictions about taste, not rules about what a listener must enjoy.' }\n];\n\n// Eight interpretable concept axes are a deliberate teaching simplification.\n// No part of this dictionary is a pretrained neural model.\nexport const CONCEPTS = [\n  { name: 'Learning', words: ['neural','networks','network','learn','learning','models','model','training','predictions','prediction','weights','parameters','patterns','computers','data','targets'] },\n  { name: 'Code', words: ['python','list','comprehension','comprehensions','loop','loops','iterable','code','expression','shorter','compact','repeats','programming','program'] },\n  { name: 'Food', words: ['pasta','garlic','dinner','recipe','cook','cooking','soup','vegetable','vegetables','food','parmesan','olive','eat'] },\n  { name: 'Search', words: ['search','keyword','keywords','matching','terms','embedding','embeddings','vector','vectors','similarity','ranking','rank','hybrid','lexical','meaning','semantic'] },\n  { name: 'Web', words: ['crawler','crawl','crawling','page','pages','links','web','queue','seen','visits','domain','robots','website','websites'] },\n  { name: 'Evidence', words: ['citation','citations','source','sources','passage','passages','evidence','claim','claims','answer','answers','quotation','truth'] },\n  { name: 'Outdoors', words: ['plant','plants','houseplant','watering','leaves','soil','hike','hiking','trail','mountain','weather','water'] },\n  { name: 'Evaluation', words: ['evaluate','evaluation','precision','recall','test','testing','judgments','relevance','metrics','benchmark','reciprocal'] }\n];\n\nexport const CRAWL_EXTRA = [\n  { id: 'crawl-chunks', title: 'Break a long page into passages', topic: 'Newly indexed', url: 'https://byte.test/chunks', body: 'Chunking splits long documents into smaller passages for retrieval. Keep the document identifier and passage offsets so a result can be traced back to its source. A chunk that is too small can lose context.' },\n  { id: 'crawl-fresh', title: 'Keeping an index up to date', topic: 'Newly indexed', url: 'https://byte.test/freshness', body: 'A search index stores information collected earlier, not a live copy of the whole web. Revisit allowed pages periodically and record when content was fetched. Remove outdated entries when appropriate.' }\n];\nconst page = (path, docId, links, extra = {}) => ({ url: `https://byte.test${path}`, docId, links, ...extra });\nexport const WEB_PAGES = [\n  page('/', null, ['/neural', '/python', '/pasta', '/private', 'https://other.test/', '/neural#weights', '/missing']),\n  page('/neural', 'neural', ['/ml', '/vectors', '/']),\n  page('/python', 'python', ['/loops', '/chunks']),\n  page('/pasta', 'pasta', ['/soup', '/']),\n  page('/private', null, [], { blocked: true }),\n  page('/ml', 'ml', ['/vectors', '/freshness']),\n  page('/vectors', 'vectors', ['/hybrid', '/chunks']),\n  page('/loops', 'loops', ['/python']),\n  page('/chunks', 'crawl-chunks', ['/freshness']),\n  page('/soup', 'soup', ['/pasta']),\n  page('/hybrid', 'hybrid', ['/vectors']),\n  page('/freshness', 'crawl-fresh', ['/'])\n];\n\n// Authored teaching judgments, intentionally small and inspectable. Not an external benchmark.\nexport const BENCHMARK = [\n  { query: 'neural networks', relevant: ['neural','ml'], kind: 'exact' },\n  { query: 'how do computers learn', relevant: ['ml','neural'], kind: 'rephrased' },\n  { query: 'Python list comprehension', relevant: ['python'], kind: 'exact' },\n  { query: 'a shorter way to write a loop', relevant: ['python','loops'], kind: 'rephrased' },\n  { query: 'quick garlic dinner', relevant: ['pasta'], kind: 'everyday' },\n  { query: 'how does a crawler discover pages', relevant: ['crawler'], kind: 'technical' },\n  { query: 'does a citation prove a claim', relevant: ['sources'], kind: 'evidence' },\n  { query: 'orbital zirconium flux capacitor', relevant: [], kind: 'out of collection' }\n];\nexport const AUDIT = [\n  { claim: 'Training updates connection weights to reduce prediction error.', source: 'neural', verdict: 'supported', quote: 'Training updates connection weights to reduce prediction error.', why: 'The cited passage explicitly supports this claim. That establishes support in this source, not a universal guarantee about every training method.' },\n  { claim: 'A high cosine similarity score proves the page answers the question.', source: 'vectors', verdict: 'contradicted', quote: 'a high score does not prove that a document answers the question.', why: 'The citation is real, but the passage says the opposite. A plausible-looking citation is not enough.' },\n  { claim: 'This search engine is faster than every commercial search engine.', source: 'evaluation', verdict: 'insufficient', quote: 'Evaluate search against a set of queries with human relevance judgments.', why: 'This source explains evaluation. It supplies no commercial timing measurements, so there is not enough evidence for that comparison.' }\n];\n","engine.js":"import { CONCEPTS, WEB_PAGES, DOCUMENTS, CRAWL_EXTRA, BENCHMARK } from './data.js';\nexport const STOPWORDS = new Set('a an and are as at be but by can do does for from have how i if in is it its me my of on or our so some that the their then there these they this to was we what when where which who why with you your'.split(' '));\nconst clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, Number(n) || 0));\n\nexport function tokenize(text, removeStopwords = true) {\n  const words = String(text ?? '').toLowerCase().match(/[\\p{L}\\p{N}]+/gu) || [];\n  return removeStopwords ? words.filter(w => !STOPWORDS.has(w)) : words;\n}\nexport function keywordDetails(query, doc, { titleWeight = 1, removeStopwords = true } = {}) {\n  const terms = [...new Set(tokenize(query, removeStopwords))];\n  const title = tokenize(doc.title, false), body = tokenize(doc.body, false);\n  const counts = terms.map(term => ({ term, title: title.filter(w => w === term).length, body: body.filter(w => w === term).length }));\n  const weight = clamp(titleWeight, 0, 5);\n  return { terms, counts, score: counts.reduce((sum, c) => sum + weight * c.title + c.body, 0) };\n}\nexport function normalize(vector) {\n  const no
